name: Release

# Publishes a GitHub Release with binaries for every platform when either:
#   - main gets a Cargo.toml version that has no release yet (bump version → push), or
#   - a tag like v0.2.0 is pushed (must match Cargo.toml), or
#   - it is run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match Cargo.toml version $tag"; exit 1
          fi
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to publish (bump the version in Cargo.toml)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     archive: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,    archive: zip }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,       archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,        archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        # skip cross-compiled targets that can't run on the build machine
        if: matrix.target != 'aarch64-pc-windows-msvc' && matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="fallow-${{ needs.meta.outputs.tag }}-${{ matrix.target }}"
          mkdir "$name"
          bin=fallow; [[ "${{ matrix.target }}" == *windows* ]] && bin=fallow.exe
          cp "target/${{ matrix.target }}/release/$bin" README.md "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: fallow ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: dist/*
