[package]
name = "fallow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast mbox analyzer and slimmer: size stats, sender/label filtering, attachment stripping"
repository = "https://github.com/edydfang/Fallow"
readme = "README.md"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
indicatif = "0.18.6"
memchr = "2.8.3"
memmap2 = "0.9.11"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
